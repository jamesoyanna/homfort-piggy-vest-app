<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewpoint" content="width=device-width,initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="image/favicon.ico">
    <title>Piggyvest Login page</title>
</head>

<body>
    <div class="login-body">
        <header class="text-center">
            <img src="image/piggyvest-logo.svg" alt="PiggyVest Logo">

        </header>
        <main class="login-body">
            <section class="login-body">
                <div class="form-info text-centr">
                    <h2>Login to your account</h2>
                    <p>Securely login to your piggyVest</p>
                </div>
                <div class="form-control">
                    <label for="email-or-no"> Email or phone number</label>
                    <input type="text" name="email-or-no" id="email-or-no" required>
                </div>
                <div class="form-control"></div>
                <label for="password"> Password</label>
                <input type="password" name="password" id="password" required>
                <div class=" form-control">
                    <input type="submit" value="LOG IN">
                </div>
            </section>
        </main>

        <footer class="text-center">
            <a href="">
                <p class="Register">Don't have an account? Register</p>
            </a>
            <p>Forget Password</p>
        </footer>
    </div>
</body>

</html>
